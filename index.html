<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Odyssey - 英単語と、あなたの冒険を。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12525c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Word Odyssey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon_180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="toast" id="toast"></div>

  <!-- HOME -->
  <section class="screen active" id="screen-home">
    <div class="statbar">
      <span class="lv" id="homeLv">Lv.1</span>
      <div class="expwrap"><span id="homeExpBar" style="width:0%"></span></div>
      <div class="curr">
        <span class="chip">💎 <span id="homeDiamond">0</span></span>
        <span class="chip">🪙 <span id="homeCoin">0</span></span>
      </div>
    </div>
    <div class="worldcard" id="homeWorld"></div>
    <div class="mascotrow">
      <div class="mascot">🐱</div>
      <div class="bubble" id="homeMascotLine">今日もがんばろう！</div>
    </div>
    <div class="card">
      <div class="row"><h3>今日の学習</h3><span class="small" id="homeToday">0 / 100語</span></div>
      <div class="bar"><span id="homeTodayBar" style="width:0%"></span></div>
    </div>
    <div class="card">
      <h3>出題モード</h3>
      <div class="seg" id="modeSeg">
        <button data-mode="normal" onclick="setMode(false)">通常</button>
        <button data-mode="split" onclick="setMode(true)">意味を分割</button>
      </div>
      <div class="small modedesc" id="homeModeDesc"></div>
    </div>
    <button class="btn" onclick="startSession()">📖 学習をはじめる</button>

    <div class="card" style="margin-top:16px;">
      <h3>苦手な単語</h3>
      <div id="homeWeakList"></div>
    </div>
  </section>

  <!-- STUDY -->
  <section class="screen" id="screen-study">
    <div class="studyhead">
      <span class="tag" id="studyStage">STAGE 1-1｜はじまりの島</span>
      <span class="chip">💎 <span id="studyDiamond">0/0</span></span>
    </div>
    <div class="qbar"><span id="qbarInner" style="width:0%"></span></div>

    <div class="card wordcard">
      <div class="small prompt" id="studyPrompt">この単語の意味として最も近いものを選んでください</div>
      <div class="word-big"><span id="studyWord">word</span></div>
      <div><span class="sensebadge" id="studySense" style="display:none;"></span></div>
    </div>
    <div class="feedback" id="studyFeedback"></div>
    <div id="studyChoices"></div>
    <button class="btn secondary" id="studyNextBtn" style="display:none;" onclick="nextQuestion()">次へ ▶</button>
  </section>

  <!-- WORLD -->
  <section class="screen" id="screen-world">
    <h1>🌍 世界</h1>
    <div class="worldcard" id="worldBig"></div>
    <div class="card small">単語を覚えるほど、世界が育っていきます。</div>
    <h2>エリア</h2>
    <div id="stageList"></div>
  </section>

  <!-- COLLECTION -->
  <section class="screen" id="screen-collection">
    <h1>🏆 コレクション</h1>
    <div class="card small" id="collectionCount">0 / 0 集めた</div>
    <div class="grid" id="collectionGrid"></div>
  </section>

  <!-- MENU -->
  <section class="screen" id="screen-menu">
    <h1>☰ メニュー</h1>
    <div class="card">
      <div class="row"><span class="small">累計学習</span><b id="menuTotal">0 語</b></div>
      <div class="row"><span class="small">定着した単語</span><b id="menuMastered">0 / 0</b></div>
      <div class="row"><span class="small">レベル</span><b id="menuLevel">1</b></div>
    </div>
    <button class="btn secondary" onclick="resetGame()">⚠️ データをリセットする</button>
  </section>

  <nav>
    <button class="active" data-scr="home" onclick="showScreen('home')"><span class="ic">🏠</span>ホーム</button>
    <button data-scr="study" onclick="showScreen('study')"><span class="ic">📖</span>学習</button>
    <button data-scr="world" onclick="showScreen('world')"><span class="ic">🌍</span>世界</button>
    <button data-scr="collection" onclick="showScreen('collection')"><span class="ic">🏆</span>コレクション</button>
    <button data-scr="menu" onclick="showScreen('menu')"><span class="ic">☰</span>メニュー</button>
  </nav>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
